[package]
name = "notch-app"
version = "0.1.0"
description = "Windows notch / dynamic island overlay"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name; on Windows
# both sharing a name breaks the link step.
name = "notch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    # Activity indicators: power, network, USB and Bluetooth.
    # Bluetooth uses an incremental Classic + BLE association-endpoint watcher.
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "implement",
    "Win32_System_WinRT",
    "Win32_System_Power",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    # Real media panel: Windows Global System Media Transport Controls.
    "Media",
    "Media_Control",
    "Storage_Streams",
] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
