[package]
name = "notch-app"
version = "0.1.0"
description = "Windows notch / dynamic island overlay"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name; on Windows
# both sharing a name breaks the link step.
name = "notch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "rustls-no-provider"] }
tokio = { version = "1", features = ["net", "fs", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sha2 = "0.10"
windows-core = "0.57"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    # Activity indicators: power, network, USB and Bluetooth.
    # Bluetooth uses an incremental Classic + BLE association-endpoint watcher.
    "Devices_Enumeration",
    "Devices_Geolocation",
    "Foundation",
    "Foundation_Collections",
    "implement",
    "Win32_System_WinRT",
    "Win32_System_Power",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    # Real media panel: Windows Global System Media Transport Controls.
    "Media",
    "Media_Control",
    "Storage_Streams",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    # System volume slider through Core Audio.
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    # System monitor & controls: Performance counters, memory, disk & session lock
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    # Brightness through Dxva2/DDC-CI, the same path the Windows flyout uses.
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    # The volume HUD's keyboard hook; the keyprobe example also reads raw input.
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    # Tray: file picker, clipboard file lists and native outgoing drag.
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
